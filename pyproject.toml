[project]
name = "enterprise-knowledge-assistant"
version = "0.1.0"
description = "A citation-first RAG API with deterministic retrieval and optional grounded generation."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
vertex = ["google-genai>=1.51"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
